name: Security audit regression probes

on:
  push:
    branches: ["security-audit-m2m-scope-2026-11-26"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  security-tests:
    name: Unit and security regression tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (informational)
        run: npm audit --omit=dev
        continue-on-error: true
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm run lint
      - name: Show formatter diff for audit test
        run: |
          npx prettier --write test/b2b/rbac_local.test.ts
          git diff -- test/b2b/rbac_local.test.ts
      - run: npm run check-format
      - run: npm run test-packages
